<!-- movieDetailModal.html -->
<template>
    <lightning-modal-header label={modalTitle}></lightning-modal-header>
    <lightning-modal-body>
        <template if:true={isLoading}>
            <div class="slds-is-relative slds-var-p-around_large">
                <lightning-spinner alternative-text="Loading details..." size="medium"></lightning-spinner>
            </div>
        </template>
        <template if:false={isLoading}>
            <template if:true={movie}>
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-text-align_center slds-var-m-bottom_medium">
                        <img src={movie.Poster} alt={movie.Title} class="modal-poster" />
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
                        <h2 class="slds-text-heading_medium slds-var-m-bottom_small">{movie.Title} ({movie.Year})</h2>
                        <div class="slds-grid slds-wrap slds-var-m-bottom_medium badge-container">
                            <span class="slds-badge slds-theme_inverse">{movie.Genre}</span>
                            <span class="slds-badge">{movie.Runtime}</span>
                            <span class="slds-badge slds-theme_success">IMDb: {movie.imdbRating}</span>
                        </div>
                        <p class="slds-text-body_regular slds-var-m-bottom_medium"><strong>Plot:</strong> {movie.Plot}</p>
                        <table class="slds-table slds-table_bordered slds-table_col-bordered detail-table">
                            <tbody>
                                <tr><td><strong>Director</strong></td><td>{movie.Director}</td></tr>
                                <tr><td><strong>Actors</strong></td><td>{movie.Actors}</td></tr>
                                <tr><td><strong>Awards</strong></td><td>{movie.Awards}</td></tr>
                                <tr><td><strong>Language</strong></td><td>{movie.Language}</td></tr>
                                <tr><td><strong>Country</strong></td><td>{movie.Country}</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </template>
        </template>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Close" variant="neutral" onclick={handleClose}></lightning-button>
    </lightning-modal-footer>
</template>
